# Install in Nginx http context (e.g. /etc/nginx/conf.d/openbitfun-auth-rate.conf)
# before nginx-auth.conf and nginx-market.conf.
#
# Collapse IPv6 clients to /64 prefixes so a single client cannot rotate /128
# addresses to bypass per-IP rate limits.
map $remote_addr $openbitfun_auth_rate_key {
    ~^([0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+): $1::/64;
    ~^([0-9a-fA-F:]+):: $1::/64;
    default $remote_addr;
}

limit_req_zone $openbitfun_auth_rate_key zone=openbitfun_auth_email_per_ip:10m rate=10r/m;
limit_req_zone $openbitfun_auth_rate_key zone=openbitfun_auth_api_per_ip:10m rate=60r/m;
limit_req_zone $openbitfun_auth_rate_key zone=openbitfun_market_api_per_ip:10m rate=120r/m;
