server {
    listen 80;
    listen [::]:80;
    # Replace with the public hostname of your market deployment.
    # Requires nginx-auth-rate.conf in Nginx http context.
    server_name market.example.com;

    access_log /var/log/nginx/miniapp-market.access.log miniapp_market_json;
    # Nginx error records include the client address and cannot use a custom
    # anonymized format. Application errors remain available as structured logs.
    error_log /dev/null crit;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Replace with the egress ranges of your own reverse proxy or WAF.
    # The placeholder ranges below are documentation-only and trust nobody.
    set_real_ip_from 192.0.2.0/24;
    set_real_ip_from 2001:db8::/32;

    client_max_body_size 25m;
    error_page 413 = @market_payload_too_large;

    location = / {
        return 308 https://market.example.com/miniapp/;
    }

    location = /miniapp {
        return 308 https://market.example.com/miniapp/;
    }

    location ^~ /miniapp/api/v1/ {
        proxy_pass http://127.0.0.1:9710;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        limit_req zone=openbitfun_market_api_per_ip burst=60 nodelay;
        limit_req_status 429;
    }

    location ^~ /miniapp/ {
        proxy_pass http://127.0.0.1:9710;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location @market_payload_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":{"code":"payload_too_large","message":"Uploads must not exceed 25 MiB.","requestId":"$request_id"}}';
    }

    location / {
        return 404;
    }
}
