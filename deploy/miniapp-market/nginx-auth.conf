# Shared OpenBitFun sign-in facade. Install beside the market host and replace
# the example hostnames below. Requires nginx-auth-rate.conf in http context,
# the trusted-proxy peer map from relay-v1/nginx-http.conf, and the
# miniapp_market_json log format.
#
# Standalone 2.0 mode (recommended): proxies identity routes directly to the
# isolated openbitfun-auth container on 127.0.0.1:9711 (docker-compose.auth.yml).
# Legacy single-container mode: point 127.0.0.1:9711 below to 127.0.0.1:9710 and
# restore the 302 bridge on /api/v1/auth/github/callback to market.example.com.
server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;
    if ($relay_v1_trusted_origin_peer = 0) { return 403; }
    access_log /var/log/nginx/miniapp-auth.access.log miniapp_market_json;
    error_log /dev/null crit;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Replace with the egress ranges of your own reverse proxy or WAF.
    # The placeholder ranges below are documentation-only and trust nobody.
    set_real_ip_from 192.0.2.0/24;
    set_real_ip_from 2001:db8::/32;
    client_max_body_size 16k;

    # Hide upstream defaults so auth.example.com sends one consistent header set.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # GitHub OAuth callback handled directly by the standalone openbitfun-auth
    # container (127.0.0.1:9711). In legacy single-container mode, return 302 to
    # https://market.example.com/miniapp/api/v1/auth/github/callback$is_args$args.
    location = /api/v1/auth/github/callback {
        proxy_cache off;
        proxy_pass http://127.0.0.1:9711/api/v1/auth/github/callback;
        limit_req zone=openbitfun_auth_api_per_ip burst=20 nodelay;
        limit_req_status 429;
    }

    # Pages sign-in uses the existing auth origin; published content stays on
    # the versioned remote origin. Expose only the browser sign-in endpoints.
    location ~ ^/v/1\.0\.0/api/(page-auth/(sign-in|login|client\.js)|auth/github/(start|poll))$ {
        rewrite ^/v/1\.0\.0/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:19700;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=relay_v1_client_requests burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/relay-v1-auth-access.log relay_v1_json;
    }

    location ~ ^/v/1\.0\.1/api/(page-auth/(sign-in|login|client\.js)|auth/github/(start|poll))$ {
        rewrite ^/v/1\.0\.1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:19701;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=relay_v101_client_requests burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/relay-v1.0.1-auth-access.log relay_v1_json;
    }

    location ~ ^/v/1\.0\.2/api/(page-auth/(sign-in|login|client\.js)|auth/github/(start|poll))$ {
        rewrite ^/v/1\.0\.2/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:19702;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=relay_v102_client_requests burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/relay-v1.0.2-auth-access.log relay_v1_json;
    }

    # OpenBitFun 2.0 Pages sign-in (openbitfun-directory on 127.0.0.1:19750).
    location ~ ^/v2/api/(page-auth/(sign-in|login|client\.js)|auth/github/(start|poll))$ {
        rewrite ^/v2/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:19750;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        limit_req zone=obf_super_client_requests burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/openbitfun-super/access.log obf_super_json;
    }

    location = /sign-in {
        # Auth HTML must select current assets even if proxy caching is enabled globally.
        proxy_cache off;
        proxy_pass http://127.0.0.1:9711/miniapp/auth/sign-in;
    }
    location = / {
        # Auth HTML must select current assets even if proxy caching is enabled globally.
        proxy_cache off;
        proxy_pass http://127.0.0.1:9711/miniapp/auth/complete;
    }
    location = /complete {
        # Auth HTML must select current assets even if proxy caching is enabled globally.
        proxy_cache off;
        proxy_pass http://127.0.0.1:9711/miniapp/auth/complete;
    }

    # Strict per-IP rate limit for email code send/verify to prevent SMTP abuse.
    location ~ ^/api/v1/auth/email/(send|verify)$ {
        rewrite ^/api/v1/(.*)$ /miniapp/api/v1/$1 break;
        proxy_pass http://127.0.0.1:9711;
        limit_req zone=openbitfun_auth_email_per_ip burst=5 nodelay;
        limit_req_status 429;
    }

    # Identity APIs only; marketplace uploads and mutations are never exposed here.
    location ~ ^/api/v1/(health|me|config|auth/desktop/(start|poll)|auth/login/(start|github)|auth/email/complete|auth/github/start|auth/(refresh|logout))$ {
        rewrite ^/api/v1/(.*)$ /miniapp/api/v1/$1 break;
        proxy_pass http://127.0.0.1:9711;
        limit_req zone=openbitfun_auth_api_per_ip burst=30 nodelay;
        limit_req_status 429;
    }
    location ^~ /miniapp/assets/ {
        proxy_pass http://127.0.0.1:9711;
    }
    location ~ ^/miniapp/(theme-init\.js|favicon\.(ico|svg)|apple-touch-icon\.png|site\.webmanifest)$ {
        proxy_pass http://127.0.0.1:9711;
    }
    location / { return 404; }
}
